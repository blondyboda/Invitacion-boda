<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestra Boda</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #f6efe3;
            color: #641f2a;
            font-family: Georgia, "Times New Roman", serif;
        }

        .portada {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        .portada::before,
        .portada::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border: 1px solid #b08a4a;
            border-radius: 50%;
            opacity: 0.35;
        }

        .portada::before {
            top: -90px;
            left: -90px;
        }

        .portada::after {
            bottom: -90px;
            right: -90px;
        }

        .contenido {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 2;
        }

        .pequeno {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .adorno {
            color: #b08a4a;
            font-size: 24px;
            margin: 10px 0;
        }

        h1 {
            font-size: clamp(48px, 12vw, 90px);
            font-weight: normal;
            line-height: 1;
            margin: 20px 0;
        }

        .ampersand {
            display: block;
            font-size: 35px;
            color: #b08a4a;
            margin: 12px 0;
        }

        .fecha {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 5px;
            margin: 30px 0;
        }

        .mensaje {
            font-size: 18px;
            line-height: 1.7;
            font-style: italic;
            max-width: 430px;
            margin: 0 auto 35px;
        }

        .boton {
            display: inline-block;
            background: #641f2a;
            color: #f6efe3;
            text-decoration: none;
            padding: 15px 32px;
            letter-spacing: 2px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            transition: 0.3s ease;
        }

        .boton:hover {
            background: #3d111a;
            transform: translateY(-2px);
        }

        .linea {
            width: 90px;
            height: 1px;
            background: #b08a4a;
            margin: 20px auto;
        }

        @media (max-width: 600px) {

            .portada {
                padding: 25px 18px;
            }

            h1 {
                font-size: 55px;
            }

            .mensaje {
                font-size: 16px;
            }

            .fecha {
                font-size: 12px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <section class="portada">

        <div class="contenido">

            <div class="pequeno">
                NUESTRA BODA
            </div>

            <div class="adorno">
                ✦
            </div>

            <h1>
                Isaí Marcelo Sánchez López
                <span class="ampersand">&amp;</span>
                Ebony Blondy Simeon Cabanillas
            </h1>

            <div class="linea"></div>

            <div class="fecha">
                17 · 11 · 2026
            </div>

            <p class="mensaje">
              «De la amistad nació un amor que nos enseñó a elegirnos cada día;
              y hoy, con Dios como guía, elegimos amarnos
              y caminar juntos para toda la vida.»
            </p>

            <a href="#invitacion" class="boton">
                ABRIR INVITACIÓN
            </a>

        </div>

    </section>

</body>
</html>
